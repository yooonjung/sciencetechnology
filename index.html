<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>문명 리셋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a toy village board. Candy-colored squishy buttons with a bottom lip, mint for action, butter-yellow for coins, pink for alerts. */
:root{
  --bg:#f3f5fb; --surface:#ffffff; --sunk:#e9edf8; --ink:#2b2d42; --muted:#666b8a; --line:#d8ddef; --lip:#c3c9e3;
  --accent:#15b48c; --accent-ink:#ffffff; --accent-soft:#d6f5ec; --accent-lip:#0e8a6b;
  --pink:#ff7aa2; --pink-soft:#ffe3ec; --sky:#9fd3f0; --sky-soft:#e3f3fc; --sun:#ffd166;
  --coin:#e69a00; --coin-soft:#fff1c9; --danger:#e5484d; --danger-soft:#ffe1e1; --ok:#1f9d5a; --ok-soft:#dcf5e6;
  --pi-praise:#ffe27a; --pi-q:#ffc2d4; --pi-idea:#bfe2ff; --pi-ink:#2b2416;
  --scene-top:#bfe6ff; --scene-bot:#eaf7ff; --hill1:#9be3b5; --hill2:#74d29c;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#181a2a; --surface:#22253a; --sunk:#2b2f48; --ink:#eef0ff; --muted:#a4a8c8; --line:#383d5c; --lip:#121423;
  --accent:#3edbb2; --accent-ink:#0d1f1a; --accent-soft:#1d3d37; --accent-lip:#1f9479;
  --pink:#ff8fb1; --pink-soft:#46263a; --sky:#5aa9d6; --sky-soft:#1f3346; --sun:#ffd166;
  --coin:#ffc23d; --coin-soft:#3e3418; --danger:#ff6b6f; --danger-soft:#47232a; --ok:#5fd394; --ok-soft:#1c3a2b;
  --scene-top:#26305a; --scene-bot:#3a4478; --hill1:#2f6f55; --hill2:#245a45;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#181a2a; --surface:#22253a; --sunk:#2b2f48; --ink:#eef0ff; --muted:#a4a8c8; --line:#383d5c; --lip:#121423;
  --accent:#3edbb2; --accent-ink:#0d1f1a; --accent-soft:#1d3d37; --accent-lip:#1f9479;
  --pink:#ff8fb1; --pink-soft:#46263a; --sky:#5aa9d6; --sky-soft:#1f3346; --sun:#ffd166;
  --coin:#ffc23d; --coin-soft:#3e3418; --danger:#ff6b6f; --danger-soft:#47232a; --ok:#5fd394; --ok-soft:#1c3a2b;
  --scene-top:#26305a; --scene-bot:#3a4478; --hill1:#2f6f55; --hill2:#245a45;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 56px}
#app{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
h2{font-size:clamp(1.6rem,3.6vw,2.1rem)}
h3{font-size:1.3rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-size:.95rem;letter-spacing:.04em;color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:20px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid2>*{min-width:0}

.panel{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:0 5px 0 var(--line)}
.panel.strong{border-color:var(--accent);box-shadow:0 5px 0 var(--accent-lip)}
.note{background:var(--sky-soft);border-radius:14px;padding:12px 16px;font-size:.95rem}
.note.pink{background:var(--pink-soft)}
.note.yellow{background:var(--coin-soft)}

button,.btn{font-family:var(--f-display);font-size:1rem;cursor:pointer;border-radius:14px;border:2px solid var(--lip);background:var(--surface);color:var(--ink);padding:8px 16px;min-height:44px;box-shadow:0 4px 0 var(--lip);transition:transform .1s ease,box-shadow .1s ease}
button:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--lip)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lip)}
button.primary{background:var(--accent);border-color:var(--accent-lip);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-lip)}
button.primary:hover{box-shadow:0 6px 0 var(--accent-lip)}
button.primary:active{box-shadow:0 1px 0 var(--accent-lip)}
button.ghost{box-shadow:none;border-color:var(--line);font-family:var(--f-body);font-weight:700}
button.ghost:hover{box-shadow:none}
button.danger{color:var(--danger);border-color:var(--danger);box-shadow:0 4px 0 var(--danger-soft)}
button.sm{min-height:36px;padding:4px 12px;font-size:.92rem}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

label,.lbl{font-weight:700;font-size:.95rem}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.field{display:flex;flex-direction:column;gap:6px}

/* top bar */
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{font-family:var(--f-display);font-size:1.5rem;background:none;border:none;box-shadow:none;padding:0;min-height:0}
.brand:hover,.brand:active{box-shadow:none}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;background:var(--accent-soft);color:var(--ink)}
.badge.sync-on{background:var(--ok-soft)}
.badge.sync-off{background:var(--sunk)}
.coins{background:var(--coin-soft);color:var(--ink);border:2px solid var(--coin);border-radius:999px;padding:3px 14px;font-weight:700;white-space:nowrap}
.coins .num{color:var(--coin)}
.coins.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.25) rotate(-4deg)}60%{transform:scale(.95)}}

/* stepper */
.stepper{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px}
.step{flex:1 0 auto;min-width:128px;text-align:left;display:flex;flex-direction:column;gap:0;font-family:var(--f-body);font-weight:700;padding:8px 14px;min-height:60px}
.step b{font-family:var(--f-display);font-weight:400;font-size:1.05rem}
.step small{color:var(--muted);font-size:.8rem}
.step.on{background:var(--ink);color:var(--surface);border-color:var(--ink);box-shadow:0 4px 0 var(--accent)}
.step.on small{color:var(--surface);opacity:.75}
.step.done:not(.on){border-color:var(--ok);box-shadow:0 4px 0 var(--ok-soft)}
.step.done b::after{content:" ✅";font-size:.85em}

/* home scene */
.scene{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(var(--scene-top),var(--scene-bot));min-height:420px;padding:32px 24px 140px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;cursor:pointer;border:2px solid var(--line);box-shadow:0 6px 0 var(--line)}
.scene .sun{position:absolute;top:18px;right:26px;font-size:3.2rem;animation:spin 18s linear infinite}
.scene .cloud{position:absolute;font-size:2.6rem;opacity:.9;animation:drift linear infinite}
.scene .hill{position:absolute;bottom:-60px;border-radius:50%}
.scene .hill.a{left:-10%;width:70%;height:200px;background:var(--hill1)}
.scene .hill.b{right:-15%;width:75%;height:180px;background:var(--hill2)}
.scene .village{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:center;gap:clamp(6px,2vw,22px);font-size:clamp(1.8rem,5vw,2.8rem)}
.scene .village span{display:inline-block;animation:hop 2.6s ease-in-out infinite}
.scene .float{position:absolute;bottom:60px;font-size:1.8rem;animation:rise linear infinite;opacity:0}
.title{font-family:var(--f-display);font-size:clamp(3rem,11vw,5.6rem);line-height:1.05;display:flex;gap:.04em;color:var(--ink);text-shadow:0 4px 0 var(--surface)}
.title span{display:inline-block;animation:bounce 2.2s ease-in-out infinite}
.subtitle{font-family:var(--f-display);font-size:clamp(1.1rem,3vw,1.5rem);background:var(--surface);border-radius:999px;padding:6px 18px;box-shadow:0 4px 0 var(--line)}
.lede{max-width:34em;font-size:1.02rem}
.tap-hint{font-size:.85rem;color:var(--muted)}
@keyframes bounce{0%,100%{transform:translateY(0)}20%{transform:translateY(-14px) rotate(-3deg)}40%{transform:translateY(0)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(calc(100vw + 140px))}}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-360px) scale(1.1) rotate(20deg);opacity:0}}
.newsflash{border:3px solid var(--danger);border-radius:var(--r);background:var(--surface);padding:22px 20px 18px;position:relative;font-size:1rem;box-shadow:0 5px 0 var(--danger-soft)}
.newsflash::before{content:"🚨 긴급 속보";position:absolute;top:-15px;left:14px;background:var(--danger);color:#fff;font-family:var(--f-display);font-size:.9rem;padding:2px 12px;border-radius:999px;animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.6}}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.choice{text-align:left;padding:18px;display:flex;flex-direction:column;gap:6px;min-height:128px;font-family:var(--f-body)}
.choice .ic{font-size:2.2rem;line-height:1}
.choice h3{font-size:1.45rem}
.choice.sel{background:var(--accent);border-color:var(--accent-lip);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-lip)}
.choice .muted{color:inherit;opacity:.8}
.groupgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.groupgrid button{font-size:1.5rem;min-height:68px}
.groupgrid.cls{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.usegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.groupgrid button.sel{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 4px 0 var(--danger)}

/* tech cards */
.techgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tech{position:relative;text-align:left;padding:12px;display:flex;flex-direction:column;gap:0;min-height:120px;font-family:var(--f-body);font-weight:700}
.tech .ic{font-size:2rem;line-height:1.1}
.tech .era{font-size:.75rem;color:var(--muted)}
.tech .nm{font-family:var(--f-display);font-weight:400;font-size:1.35rem;line-height:1.2}
.tech .hint{font-size:.8rem;color:var(--muted);font-weight:400}
.tech.own{background:var(--accent);border-color:var(--accent-lip);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-lip)}
.tech.own .era,.tech.own .hint{color:var(--accent-ink);opacity:.85}
.tech.bad.own{background:var(--danger);border-color:var(--danger);box-shadow:0 4px 0 var(--danger-soft);color:#fff}
.tech .price{position:absolute;top:8px;right:8px;background:var(--coin-soft);color:var(--ink);border:2px solid var(--coin);border-radius:999px;font-size:.75rem;padding:0 8px;font-family:var(--f-num)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:999px;padding:3px 12px;font-size:.92rem}
.chip button{min-height:0;border:none;box-shadow:none;padding:0 2px;background:none;color:var(--muted);font-size:1rem;line-height:1}

/* flip card */
.flipwrap{perspective:1200px;display:flex;justify-content:center}
.flip{width:min(100%,340px);aspect-ratio:3/4;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1.2)}
.flip.show{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;border:3px solid var(--ink);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:24px;text-align:center}
.face.back{background:repeating-linear-gradient(45deg,var(--pink) 0 16px,var(--pink-soft) 16px 32px)}
.face.back.mint{background:repeating-linear-gradient(45deg,var(--accent) 0 16px,var(--accent-soft) 16px 32px)}
.face.back span{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:8px 16px;font-family:var(--f-display);font-size:1.4rem}
.face.front{background:var(--surface);transform:rotateY(180deg)}
.face.front .bigic{font-size:4rem;line-height:1}
.face.front .big{font-family:var(--f-display);font-size:clamp(1.5rem,5.5vw,2.1rem);line-height:1.25}
.face.front.event{background:var(--danger-soft)}
.face.front.good{background:var(--ok-soft)}

/* prompt + sites */
.prompt{border:2px dashed var(--accent);border-radius:14px;background:var(--accent-soft);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.prompt .pt{white-space:pre-wrap;font-size:.95rem;user-select:text}
.prompt .row{justify-content:space-between}
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
.site{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--ink);text-decoration:none;box-shadow:0 3px 0 var(--line)}
.site:hover{border-color:var(--accent)}
.site .ic{font-size:1.5rem;line-height:1.2}
.site b{display:block;font-size:.95rem}
.site small{color:var(--muted);font-size:.8rem;line-height:1.4;display:block}
.checklist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}
.checklist label{font-weight:400;display:flex;gap:8px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:8px 10px}
.checklist input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--accent)}

/* verdict */
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:38px;padding:4px 12px;font-size:.92rem}
.seg button.sel.adopt{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.sel.edit{background:var(--coin);border-color:var(--coin);color:#2b1d00}
.seg button.sel.reject{background:var(--danger);border-color:var(--danger);color:#fff}
.idea{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}

/* sentence */
.sentence{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-family:var(--f-display);font-size:clamp(1.15rem,2.6vw,1.5rem)}
.sentence input{flex:1 1 200px;font-family:var(--f-body);font-size:1.05rem;border-style:dashed;border-color:var(--accent)}

/* poster */
.poster{border:3px solid var(--ink);border-radius:22px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 0 var(--lip)}
.poster .ph{aspect-ratio:4/3;background:var(--sunk);display:flex;align-items:center;justify-content:center;color:var(--muted);max-width:100%;text-align:center;padding:10px}
.poster .ph img{width:100%;height:100%;object-fit:cover}
.poster .pb{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.poster .pname{font-family:var(--f-display);font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.2}
.poster dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.poster dt{font-weight:700;font-size:.88rem;color:var(--accent);white-space:nowrap}
.poster dd{margin:0;min-width:0;overflow-wrap:anywhere}
.poster.mini .ph{aspect-ratio:16/9}
.poster.mini .pname{font-size:1.25rem}
.poster.mini dl{font-size:.88rem}

/* post-its */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;align-content:start;background:var(--sunk);border-radius:var(--r);padding:16px;min-height:200px}
.pi{color:var(--pi-ink);padding:12px 12px 10px;min-height:118px;display:flex;flex-direction:column;gap:6px;box-shadow:0 3px 0 rgba(0,0,0,.12),0 8px 16px rgba(0,0,0,.08);font-size:.98rem;overflow-wrap:anywhere;border-radius:4px 4px 16px 4px;animation:stick .35s ease-out}
@keyframes stick{from{transform:scale(.4) rotate(12deg);opacity:0}}
.pi:nth-child(3n+1){rotate:-1.8deg} .pi:nth-child(3n+2){rotate:1.4deg} .pi:nth-child(3n){rotate:-.5deg}
.pi .who{font-size:.78rem;font-weight:700;opacity:.8}
.pi.praise{background:var(--pi-praise)} .pi.q{background:var(--pi-q)} .pi.idea{background:var(--pi-idea)}
.pi textarea{background:rgba(255,255,255,.6);color:var(--pi-ink);border-color:rgba(0,0,0,.15);min-height:60px;font-size:.9rem}
.typepick button{color:var(--pi-ink)}
.typepick button.sel{outline:3px solid var(--ink);outline-offset:2px}
.typepick .praise{background:var(--pi-praise)} .typepick .q{background:var(--pi-q)} .typepick .idea{background:var(--pi-idea)}
.empty{color:var(--muted);text-align:center;padding:28px 10px;grid-column:1/-1}

/* timer */
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ink);color:var(--surface);border-radius:var(--r);padding:12px 16px}
.timer .t{font-family:var(--f-num);font-size:2.2rem;font-weight:600;min-width:5ch;font-variant-numeric:tabular-nums}
.timer.over .t{color:var(--pink)}
.timer button{background:transparent;color:var(--surface);border-color:var(--muted);box-shadow:none;min-height:36px;padding:4px 12px;font-size:.92rem}

/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.94rem}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{font-size:.82rem;color:var(--muted)}
.grid-in{width:64px;padding:6px;text-align:right;font-family:var(--f-num)}
td.self{background:var(--sunk)}
.bar{height:24px;background:linear-gradient(90deg,var(--sun),var(--coin));border-radius:999px;min-width:4px;transition:width .5s}

.result{border-radius:12px;padding:10px 14px;font-weight:700}
.result.loss{background:var(--danger-soft);color:var(--danger)}
.result.safe{background:var(--ok-soft);color:var(--ok)}

/* teacher records */
.recgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.rec{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:0 4px 0 var(--line);font-size:.94rem}
.rec .rh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rec .rh b{font-family:var(--f-display);font-weight:400;font-size:1.3rem}
.rec .k{font-size:.78rem;color:var(--accent);font-weight:700}
.rec .v{overflow-wrap:anywhere;white-space:pre-wrap}
.rec.none{opacity:.55}
.rec.fresh{animation:flash 1.2s}
@keyframes flash{0%{border-color:var(--pink);box-shadow:0 4px 0 var(--pink)}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 20px;border-radius:999px;font-family:var(--f-display);z-index:50;max-width:calc(100% - 32px);animation:pop .3s}
@keyframes pop{from{transform:translate(-50%,20px);opacity:0}}
.confirm{border:2px solid var(--danger);background:var(--danger-soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.burst{position:fixed;pointer-events:none;z-index:60;font-size:1.6rem;animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.6);opacity:0}}

/* gallery */
.gallery{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
@media (max-width:820px){.gallery{grid-template-columns:1fr}}
.gal-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}

let AC=null;
function tone(f,t0,d,type,vol,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,AC.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+t0+d);
  g.gain.setValueAtTime(0.0001,AC.currentTime+t0);g.gain.exponentialRampToValueAtTime(vol||.12,AC.currentTime+t0+.015);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+t0+d);o.connect(g).connect(AC.destination);o.start(AC.currentTime+t0);o.stop(AC.currentTime+t0+d+.05)}
function sfx(k){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  ({click:()=>tone(720,0,.07,'triangle',.08),
    pop:()=>tone(500,0,.12,'sine',.14,1200),
    coin:()=>{tone(988,0,.08,'square',.06);tone(1319,.08,.22,'square',.06)},
    flip:()=>{[523,659,784].forEach((f,i)=>tone(f,i*.06,.14,'triangle',.1))},
    win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.22,'triangle',.11))},
    bad:()=>{tone(330,0,.18,'sawtooth',.06,220);tone(220,.18,.3,'sawtooth',.06,140)},
    ding:()=>{[784,988,1175].forEach((f,i)=>tone(f,i*.18,.5,'sine',.12))},
    boing:()=>tone(220,0,.3,'sine',.15,660)})[k]?.()}catch(e){}}
function burst(x,y,set,n){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const em=set||['✨','⭐','🎉','💫'];
  for(let i=0;i<(n||12);i++){const s=document.createElement('span');s.className='burst';s.textContent=em[i%em.length];s.style.left=x+'px';s.style.top=y+'px';
    const a=Math.random()*Math.PI*2,r=60+Math.random()*90;s.style.setProperty('--dx',Math.cos(a)*r+'px');s.style.setProperty('--dy',Math.sin(a)*r-40+'px');s.style.setProperty('--rot',(Math.random()*120-60)+'deg');

function evDelta(ev,ids){if(!ev)return 0;if(ev.all)return ev.all;if(ev.bonus)return ev.bonus.some(t=>ids.includes(t))?ev.gain:0;return ev.save.some(t=>ids.includes(t))?0:-ev.loss}
function groupCoins(g){const ids=g.l1.techs.map(t=>t.id);return 100-g.l1.techs.reduce((s,t)=>s+(+t.price||0),0)+g.l1.events.reduce((s,id)=>s+evDelta(E(id),ids),0)}
function tTechs(n){return TCH().auction.filter(a=>a.group===n)}
function tCoins(n){const ids=tTechs(n).map(a=>a.tech);return 100-tTechs(n).reduce((s,a)=>s+(+a.price||0),0)+TCH().events.reduce((s,id)=>s+evDelta(E(id),ids),0)}
function investUsed(g){return Object.values(g.l3.invest||{}).reduce((s,v)=>s+(+v.coins||0),0)}

function stepDone(L,k,g){
  const a=g.l1,b=g.l2,c=g.l3;
  switch(L+k){
    case '1intro':return filled(a.trouble);
    case '1auction':return a.techs.length>0;
    case '1explore':return a.techs.length>0&&a.techs.every(t=>filled(getP(a,'explore.'+t.id+'.err'))&&filled(getP(a,'explore.'+t.id+'.src')));
    case '1event':return a.events.length>0&&filled(a.promo);
    case '1wrap':return filled(a.s1)&&filled(a.s2);
    case '2draw':return !!b.card;
    case '2principle':return (b.useTechs||[]).length>0&&b.principles.length>=2&&b.checked;
    case '2ai':return b.ideas.length>0&&b.ideas.every(i=>i.verdict&&filled(i.reason));
    case '2poster':return filled(b.poster.name)&&filled(b.poster.principle);
    case '2wrap':return filled(b.why);
    case '3prep':return b.postits.filter(p=>p.type==='q').every(p=>filled(c.answers[p.ts]));
    case '3pitch':return c.aiqs.length>0;
    case '3invest':return investUsed(g)===100;
    case '3wrap':return filled(c.r1)&&filled(c.help)&&filled(c.wrong);
  }return false;
}

 ${Array.from({length:NG},(_,i)=>i+1).map(n=>`<tr><td><b>🏠 ${n}모둠</b></td><td class="num" style="color:var(--coin);font-weight:600">${tCoins(n)}</td><td><div class="row">${tTechs(n).map(a=>`<span class="chip">${T(a.tech).ic} ${T(a.tech).name} <span class="num small">${a.price}</span><button data-act="t-unsell" data-v="${a.tech}" aria-label="${T(a.tech).name} 취소">×</button></span>`).join('')||'<span class="small muted">-</span>'}</div></td></tr>`).join('')}</tbody></table></div></div>`}

/* ---------- 렌더 ---------- */
function render(){
  const app=document.getElementById('app');
  let v=S.view;
  if(v==='lesson'&&!(S.lesson&&S.role&&S.cls))v='home';
  if(v==='gallery'&&!(S.role==='group'&&S.groupNo&&S.cls))v='home';
  const body=v==='gallery'?vGallery():v==='lesson'?(S.role==='teacher'?vTeacher():vLesson()):vHome();
  app.innerHTML=(v==='gallery'?'':topbar())+body;
  if(ui.pw){const p=document.getElementById('pw-in');if(p&&document.activeElement!==p)p.focus()}
}

 'pr-add':()=>{const i=document.getElementById('pr-new'),v=i.value.trim();if(!v){i.focus();return false}G().l2.principles.push(v);sfx('pop')},

 'img-del':()=>{G().l2.poster.img=''},

   TCH().auction.push({tech:TCH().curTech,group:ui.tWin,price:+p});sfx('coin');burstAt(el,['🔨','🪙','🎉'],14);toast(`🔨 ${ui.tWin}모둠이 ${T(TCH().curTech).ic} ${T(TCH().curTech).name} 낙찰!`);TCH().curTech=null;ui.tWin=null;ui.tPrice=''},

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.tagName==='SELECT')return;
  if(el.closest('a'))return;
  const f=A[el.dataset.act];if(!f)return;
  const r=f(el,e);
  if(el.type==='checkbox'){save();if(el.dataset.act!=='chk'){const y=scrollY;render();scrollTo(0,y)}return}
  if(r===false)return;
  if(r!=='ui')save();
  const y=scrollY;render();
  if(!['lesson','step','gallery','gallery-exit','go-home','go-lessons'].includes(el.dataset.act))scrollTo(0,y);
  if(el.dataset.act==='tech-toggle'||el.dataset.act==='ev-toggle'){document.querySelectorAll('.coins').forEach(c=>{c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')})}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.bind){let v=el.value;if(el.dataset.num)v=v===''?'':Math.max(0,Math.min(100,+v));setP(G(),el.dataset.bind,v);save();
    if(el.dataset.bind.startsWith('l2.poster.')){const g=G(),pt=document.getElementById('pt-img'),pv=document.getElementById('poster-preview');if(pt)pt.textContent=imgPrompt(g);if(pv)pv.innerHTML=posterHTML(g.l2.poster,false,g.l2.useTechs)}
    if(el.dataset.rerender){clearTimeout(el._rt);const id=el.getAttribute('aria-label');el._rt=setTimeout(()=>{const y=scrollY;render();scrollTo(0,y);const n=[...document.querySelectorAll('[data-bind]')].find(x=>x.getAttribute('aria-label')===id);if(n)n.focus()},600)}
    return}
  if(el.dataset.tgrid){TCH().grid[el.dataset.tgrid]=el.value===''?'':Math.max(0,+el.value);save();clearTimeout(el._rt);const k=el.dataset.tgrid;el._rt=setTimeout(()=>{const y=scrollY;render();scrollTo(0,y);const n=document.querySelector(`[data-tgrid="${k}"]`);if(n)n.focus()},800);return}
  if(el.id==='t-price')ui.tPrice=el.value;
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.actChange==='t-cur'){TCH().curTech=el.value||null;ui.tWin=null;ui.tPrice='';sfx('flip');save();render()}
  if(el.dataset.actChange==='t-rot'){const t=TCH();t.rotRounds=+el.value;t.round=Math.min(t.round,t.rotRounds);save();render()}
  if(el.dataset.img&&el.files&&el.files[0]){const file=el.files[0];const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const m=640,s=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    G().l2.poster.img=c.toDataURL('image/jpeg',0.72);save(true);render();sfx('win');toast('🖼️ 그림을 올렸어요')};im.onerror=()=>toast('이 파일은 그림으로 열 수 없어요. PNG나 JPG를 올려 주세요.');im.src=rd.result};rd.readAsDataURL(file)}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pw-in'){e.preventDefault();if(A['pw-ok']()!==false){save();render()}return}if(e.key==='Enter'&&e.target.id==='pr-new'){e.preventDefault();if(A['pr-add']()!==false){save();render();document.getElementById('pr-new')?.focus()}}});
setInterval(()=>{if(S.role==='teacher'&&S.view==='lesson'&&(S.step['t'+S.lesson]||'records')==='records'){const a=document.activeElement;if(!(a&&a.matches('input,textarea,select')))if(document.querySelector('.rec')){const y=scrollY;render();scrollTo(0,y)}}},30000);
if(S.role==='teacher'&&!teacherOK())S.role=null;
render();
initSync();
